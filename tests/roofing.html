<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Roof tile regression tests</title>
<pre id="results">Running...</pre>
<script type="module">
import { roofWidthRange, tileGaugeLimit } from '../js/roofing.js';
import { rafterStarts } from '../js/framing.js';

const results = document.querySelector('#results');
const key = 'farstu-designer-settings-v1';
const original = localStorage.getItem(key);
const frame = document.createElement('iframe');
const passed = [];
function assert(condition, message) {
  if (!condition) throw new Error(message);
}
function close(actual, expected) {
  assert(Math.abs(actual-expected) < 1e-8, `${actual} != ${expected}`);
}
async function load() {
  const ready = new Promise(resolve => frame.onload = resolve);
  frame.src = '../?roofing-regression';
  document.body.append(frame);
  await ready;
}
try {
  for (const step of [1,250,300]) {
    for (let width=1200; width<=6000; width++) {
      for (const overhang of [0,.5,180,499.5,999.5,1000]) {
        const range = roofWidthRange(width,overhang,step,1000);
        assert(range.min <= range.max,'No feasible roof width');
        for (const roofWidth of [range.min,range.max]) {
          const right = roofWidth-width-overhang;
          assert(right >= 0 && right <= 1000,'Opposite overhang escaped bounds');
          assert(Number.isInteger(roofWidth/step),'Width not aligned to covering module');
        }
        assert(range.min-step < width+overhang,'Minimum excludes a fitting width');
        assert(range.max+step > width+overhang+1000,'Maximum excludes a fitting width');
      }
    }
  }
  const rafters = rafterStarts(3300,500,45,600);
  close(rafters[0],-500);
  close(rafters.at(-1)+45,2800);
  assert(rafters.every(x => x >= -500 && x+45 <= 2800),'Rafters escaped asymmetric roof');
  passed.push('Asymmetric roof width bounds, whole modules, odd slabs and edge rafters');

  localStorage.removeItem(key);
  await load();
  const doc = () => frame.contentDocument;
  const field = id => doc().getElementById(id);
  const edit = (id,value,event='input') => {
    field(id).value = String(value);
    field(id).dispatchEvent(new frame.contentWindow.Event(event,{bubbles:true}));
  };
  const valid = () => assert(!field('status').textContent,field('status').textContent);
  close(Number(field('roofWidth').value),3160);
  edit('doorSideOverhang',300);
  valid();
  close(Number(field('roofWidth').value),3160);
  assert(field('roof-layout-guidance').textContent.includes('Opposite (right) overhang: 60 mm'),'Wrong opposite overhang');
  edit('roof-material','tiles','change');
  valid();
  close(Number(field('width').value),2800);
  close(Number(field('roofWidth').value),3300);
  close(Number(field('doorSideOverhang').value),300);
  close(Number(field('roofWidth').step),300);
  assert(field('tile-layout-guidance').textContent.includes('30 mm side overlap'), 'Missing overlap');
  for (const [width,overhang,total,tile] of [
    [2801,180,3300,300],[2999,0,3000,300],[2801,1000,3900,300],
    [2801,180,3250,250],[3000,0,3000,300],[3000,1000,5000,250]
  ]) {
    edit('roof-material','standingSeam','change');
    edit('doorSideOverhang',overhang);
    edit('width',width);
    edit('roofWidth',total);
    edit('tileWidth',tile);
    edit('roof-material','tiles','change');
    valid();
    close(Number(field('roofWidth').value),total);
    close(Number(field('doorSideOverhang').value),overhang);
    close(Number(field('width').value),width);
    const facets = tile === 300 ? 16 : 8;
    close(doc().querySelectorAll('.tile-profile').length,total/tile*facets);
    field('roofWidth').stepUp();
    field('roofWidth').dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));
    valid();
    const stepped = Math.min(total+tile,Number(field('roofWidth').max));
    close(Number(field('roofWidth').value),stepped);
    field('roofWidth').stepDown();
    field('roofWidth').dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));
    valid();
    close(Number(field('roofWidth').value),stepped-tile);
    edit('roofWidth',total);
  }
  edit('tileWidth',300);
  valid();
  close(Number(field('roofWidth').value),4800);
  close(Number(field('doorSideOverhang').value),1000);
  edit('roof-material','standingSeam','change');
  edit('doorSideOverhang',180);
  edit('width',2801);
  edit('roofWidth',3250);
  edit('tileWidth',250);
  edit('roof-material','tiles','change');
  valid();
  passed.push('Independent door-side offset, tile-stepped roof width and whole drawn tile columns');

  for (const [pitch,max] of [[14,320],[17.99,320],[18,340],[21.99,340],[22,375]]) {
    close(tileGaugeLimit(pitch),max);
    edit('tileLength',310);
    edit('pitch',pitch);
    edit('tileLength',max);
    valid();
    edit('tileLength',max+1);
    assert(field('tileLength').getAttribute('aria-invalid') === 'true','Excessive batten gauge accepted');
  }
  edit('tileLength',310);
  edit('pitch',14);
  valid();
  const before = field('drawing').innerHTML;
  for (const invalid of ['',-1,1001,.25]) {
    edit('doorSideOverhang',invalid);
    assert(field('doorSideOverhang').getAttribute('aria-invalid') === 'true','Invalid overhang accepted');
    assert(field('drawing').innerHTML === before,'Invalid input changed drawing');
  }
  edit('doorSideOverhang',180);
  valid();
  for (const invalid of ['',3001,2750,4000]) {
    edit('roofWidth',invalid);
    assert(field('roofWidth').getAttribute('aria-invalid') === 'true','Invalid roof width accepted');
  }
  edit('roofWidth',3250);
  valid();
  edit('doorSideOverhang',500);
  assert(field('roofWidth').getAttribute('aria-invalid') === 'true','Roof not covering the slab was accepted');
  edit('doorSideOverhang',180);
  valid();
  edit('roof-material','standingSeam','change');
  edit('roofWidth',3251);
  valid();
  close(Number(field('roofWidth').value),3251);
  close(Number(field('roofWidth').step),1);
  assert(field('tile-layout-guidance').hidden,'Tile guidance shown for metal');
  passed.push('Pitch limits, invalid widths and overhangs, slab coverage and 1 mm metal steps');

  edit('roof-material','tiles','change');
  valid();
  const saved = JSON.parse(localStorage.getItem(key));
  await load();
  valid();
  assert(field('roofWidth').value === saved.fields.roofWidth,'Saved width did not round-trip');
  assert(field('doorSideOverhang').value === saved.fields.doorSideOverhang,'Saved offset did not round-trip');
  saved.fields.tileWidth = '290';
  saved.fields.tileLength = '330';
  saved.fields.sideOverhang = '180';
  delete saved.fields.roofWidth;
  delete saved.fields.doorSideOverhang;
  localStorage.setItem(key,JSON.stringify(saved));
  await load();
  valid();
  close(Number(field('tileWidth').value),300);
  close(Number(field('tileLength').value),320);
  close(Number(field('doorSideOverhang').value),180);
  const total = Number(field('roofWidth').value);
  assert(Number.isInteger(total/300),'Legacy width not snapped');
  assert(field('storage-status').textContent.includes('adjusted'),'Missing migration notice');
  passed.push('Asymmetric saved layouts round-trip and old symmetric settings migrate with notice');

  const factor = Math.hypot(1,Math.tan(Number(field('pitch').value)*Math.PI/180));
  const area = total*(Number(field('length').value)+Number(field('frontOverhang').value))*factor/1e6;
  field('show-bom').click();
  const covering = [...doc().querySelectorAll('#roof-rows tr')]
    .find(row => row.textContent.includes('Benders concrete tiles covering'));
  close(Number(covering.querySelector('td').textContent.replaceAll(',','')),Number((area*1.1).toFixed(2)));
  field('show-loads').click();
  const roofLoad = [...doc().querySelectorAll('#loads-view tr')]
    .find(row => row.textContent.includes('Roof benders concrete tiles, deck'));
  const actualKg = Number(roofLoad.querySelector('td').textContent.replaceAll(',',''));
  assert(Math.abs(actualKg-area*56.5) <= 1,'Load estimate uses a different roof width');
  const outline = doc().querySelector('.loads-roof');
  close(Number(outline.getAttribute('x')),-180);
  close(Number(outline.getAttribute('width')),total);
  const firstPierRoof = () => Number(field('loads-rows').querySelector('tr').cells[4].textContent.replaceAll(',',''));
  const previousRoofLoad = firstPierRoof();
  edit('doorSideOverhang',400);
  valid();
  assert(Math.abs(firstPierRoof()-previousRoofLoad) > 1,'Roof offset did not change pier loads');
  close(Number(doc().querySelector('.loads-roof').getAttribute('x')),-400);
  passed.push('Schedule area, load outline and pier reactions follow the asymmetric roof');
  field('show-designer').click();
  for (const mode of ['tiles','rafters']) {
    edit('roof-display',mode,'change');
    for (const view of ['3d','front','left','right','plan']) {
      doc().querySelector(`[data-view="${view}"]`).click();
      assert(doc().querySelectorAll('#drawing polygon').length > 0,`Empty ${mode}/${view} drawing`);
      assert(!/NaN|Infinity/.test(field('drawing').innerHTML),`Invalid ${mode}/${view} coordinates`);
    }
  }
  passed.push('Asymmetric covering and rafters render in all five views');

  localStorage.removeItem(key);
  await load();
  edit('width',2400);
  edit('length',1800);
  const points = polygon => polygon.getAttribute('points').trim().split(/\s+/).map(pair => pair.split(',').map(Number));
  for (const [material,width,offset,overhang,pitch] of [
    ['standingSeam',4201,1000,1000,14],['tiles',4200,800,650,45],['standingSeam',2400,0,0,14]
  ]) {
    edit('roof-material',material,'change');
    edit('roofWidth',width);
    edit('doorSideOverhang',offset);
    edit('frontOverhang',overhang);
    edit('pitch',pitch);
    valid();
    for (const mode of ['tiles','rafters','none']) {
      edit('roof-display',mode,'change');
      for (const view of ['3d','plan']) {
        doc().querySelector(`[data-view="${view}"]`).click();
        const ground = doc().querySelector('.ground-plane');
        const shadow = doc().querySelector('.roof-ground-projection');
        assert(shadow && shadow.previousElementSibling === ground,'Roof projection is missing or painted over the building');
        const grade = points(ground), footprint = points(shadow);
        const margin = Math.min(350,2400*.2,1800*.2);
        const roofLength = 1800+overhang;
        const offsets = [[margin,0],[margin+width,0],[margin+width,roofLength],[margin,roofLength]];
        for (let i=0;i<4;i++) for (let axis=0;axis<2;axis++) {
          close(footprint[i][axis],grade[0][axis] +
            (grade[1][axis]-grade[0][axis])*offsets[i][0]/(width+2*margin) +
            (grade[3][axis]-grade[0][axis])*offsets[i][1]/(roofLength+margin));
        }
        const rgb = element => frame.contentWindow.getComputedStyle(element).fill.match(/\d+/g).map(Number);
        const grass = rgb(ground);
        assert(grass[1] > grass[0] && grass[1] > grass[2],'Ground is not grass green');
        assert(rgb(shadow).every((channel,i) => channel < grass[i] && grass[i]-channel <= 30),
          'Roof projection is not slightly darker than the ground');
        assert(frame.contentWindow.getComputedStyle(ground).stroke === 'none','Ground has a visible outline');
        assert(frame.contentWindow.getComputedStyle(shadow).stroke === 'none','Roof projection has a dark outline');
        assert(frame.contentWindow.getComputedStyle(ground).filter.includes('blur('),'Ground edges are not softened');
        assert(frame.contentWindow.getComputedStyle(shadow).filter.includes('blur('),'Roof shadow has a hard edge');
        assert(!field('drawing').querySelector('polygon[stroke-dasharray="7 5"]'),
          'Roof outline is visible over the shadow');
      }
    }
  }
  for (const view of ['3d','plan']) {
    doc().querySelector(`[data-view="${view}"]`).click();
    field('toggle-ground').click();
    assert(!doc().querySelector('.roof-ground-projection'),'Hidden ground retained the roof projection');
    if (view === 'plan') {
      edit('roof-display','tiles','change');
      assert(doc().querySelector('polygon[stroke-dasharray="7 5"]'),'Hidden ground lost the roof outline');
    }
    field('toggle-ground').click();
    assert(doc().querySelector('.roof-ground-projection'),'Restored ground lost the roof projection');
  }
  for (const view of ['front','left','right']) {
    doc().querySelector(`[data-view="${view}"]`).click();
    assert(!doc().querySelector('.roof-ground-projection'),'An elevation rendered an edge-on ground polygon');
  }
  passed.push('Vertical roof footprint follows asymmetric dimensions, stays on grade, uses subtle shading and respects display toggles');
  results.textContent = `PASS (${passed.length})\n${passed.join('\n')}`;
} catch (error) {
  results.textContent = `FAIL after ${passed.length} groups: ${error.message}\n${error.stack}`;
  console.error(error);
} finally {
  frame.remove();
  if (original === null) localStorage.removeItem(key);
  else localStorage.setItem(key,original);
}
</script>
</html>
