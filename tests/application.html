<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Application reliability regression tests</title>
<pre id="results">Running...</pre>
<script type="module">
import { deromeCatalogue } from '../js/derome.js';
import { clippedHeight, wallMembers } from '../js/framing.js';
import { buildBom } from '../js/bom.js';
import { computeLoads, densities } from '../js/loads.js';
import { createNumberFormat } from '../js/number-format.js';

const results = document.querySelector('#results');
const settingsKey = 'farstu-designer-settings-v1';
const lumberKey = 'farstu-derome-quotes-v1';
const roofKey = 'farstu-roof-quotes-v1';
const originals = new Map([settingsKey,lumberKey,roofKey].map(key => [key,localStorage.getItem(key)]));
const frame = document.createElement('iframe');
const passed = [], failed = [];
let doc, win;
function assert(condition, message) {
  if (!condition) throw new Error(message);
}
async function load(clear = false) {
  if (clear) for (const key of originals.keys()) localStorage.removeItem(key);
  const ready = new Promise(resolve => frame.onload = resolve);
  frame.src = '../?application-regression';
  if (!frame.isConnected) document.body.append(frame);
  await ready;
  doc = frame.contentDocument;
  win = frame.contentWindow;
  assert(doc.getElementById('app-error').hidden,'Application startup failed');
}
const field = id => doc.getElementById(id);
function change(input, value) {
  input.value = String(value);
  input.dispatchEvent(new win.Event('change',{bubbles:true}));
}
function edit(id, value) {
  field(id).value = String(value);
  field(id).dispatchEvent(new win.Event('input',{bubbles:true}));
  assert(!field('status').textContent,field('status').textContent);
}
async function check(name, run) {
  try {
    await run();
    passed.push(name);
  } catch (error) {
    failed.push(`${name}: ${error.message}`);
    console.error(name,error);
  }
}
try {
  function houseGeometry() {
    const bounds = selector => {
      const polygon = doc.querySelector(selector);
      assert(polygon,`Missing ${selector}`);
      const points = polygon.getAttribute('points').trim().split(/\s+/).map(pair => pair.split(',').map(Number));
      const xs = points.map(point => point[0]), ys = points.map(point => point[1]);
      return {left:Math.min(...xs),right:Math.max(...xs),top:Math.min(...ys),bottom:Math.max(...ys)};
    };
    const facade = bounds('.house-facade'), base = bounds('polygon.house-concrete-base');
    const slab = bounds('.slab-edge');
    const scale = (facade.right-facade.left)/Number(field('houseWallWidth').value);
    const firstCover = bounds('polygon.cladding-cover:not([data-layer])');
    const window = key => bounds(`polygon[data-window="${key}"][data-window-part="glass"]`);
    const left = window('houseLeft'), right = window('houseRight'), upper = window('houseUpper');
    const centre = rect => (rect.left+rect.right)/2;
    return {
      wallFromLeftCentre: (facade.left-centre(left))/scale,
      slabFromLeftCentre: (slab.left-centre(left))/scale,
      rightFromLeftCentre: (centre(right)-centre(left))/scale,
      upperFromLeftCentre: (centre(upper)-centre(left))/scale,
      firstCoverFromWall: (firstCover.right-facade.left)/scale,
      leftHeight: (base.bottom-(left.top+left.bottom)/2)/scale,
      wallHeight: (base.bottom-facade.top)/scale
    };
  }
  function near(actual, expected, message) {
    assert(Math.abs(actual-expected) < .01,`${message}: ${actual} != ${expected}`);
  }

  await check('Doubled sill studs avoid grid overlaps and feed lumber and load estimates',() => {
    const top = () => 2350;
    for (const start of [580.5,600]) {
      const op = {start,end:start+900,bottom:900,top:1900};
      const members = wallMembers(0,2800,top,op,45,600,true);
      const lower = members.filter(m => m.kind === 'stud' && m.a >= op.start && m.b <= op.end &&
        m.low(m.a) === 45 && m.high(m.a) === 855).sort((a,b) => a.a-b.a);
      for (const a of [op.start,op.start+45,op.end-90,op.end-45]) {
        assert(lower.filter(m => m.a === a && m.b === a+45).length === 1,'Missing or duplicated sill stud');
      }
      assert(lower.every((m,i) => !i || lower[i-1].b <= m.a),'Sill studs overlap a regular grid stud');
      const above = list => list.filter(m => m.kind === 'stud' && m.a >= op.start && m.b <= op.end &&
        m.low(m.a) === op.top+45).map(m => `${m.a},${m.b}`).join(';');
      assert(above(members) === above(wallMembers(0,2800,top,op,45,600)),
        'Adding sill studs changed the framing above the opening');
    }

    const slope = .25;
    const model = {
      width:2800,length:2200,wallThickness:145,slabThickness:140,footingColumns:3,footingRows:2,
      footingDiameter:251,footingDepth:400,frontWallHeight:2350,rear:2350+slope*2200,slope,
      windows:{front:{start:900,end:1800,bottom:900,top:1900},right:{start:500,end:1400,bottom:900,top:1900}},
      offset:550,doorWidth:1000,doorHeight:2100,studWidth:45,studDepth:95,studSpacing:600,
      roofWidth:3160,doorSideOverhang:180,frontOverhang:350,rafterWidth:45,rafterDepth:170,
      rafterSpacing:600,roofMaterial:'standingSeam',baseBoardWidth:145,coverBoardWidth:120,claddingSpacing:200,trimWidth:95
    };
    const sideTop = u => model.rear-slope*u;
    const walls = [
      [model.length-model.wallThickness,sideTop,{start:550,end:1550,bottom:0,top:2100}],
      [model.width,top,model.windows.front],
      [model.length-model.wallThickness,sideTop,model.windows.right]
    ];
    let oldCount = 0, oldArea = 0;
    for (const [end,wallTop,opening] of walls) {
      for (const m of wallMembers(0,end,wallTop,opening,45,600)) {
        const height = u => clippedHeight(wallTop,m.high,u)-clippedHeight(wallTop,m.low,u);
        if (Math.max(height(m.a),height(m.b)) <= 0) continue;
        if (m.kind === 'stud') oldCount++;
        oldArea += (height(m.a)+height(m.b))/2*(m.b-m.a);
      }
    }
    const studCuts = buildBom(model).filter(row => row.role === 'Studs').reduce((n,row) => n+row.cuts.length,0);
    assert(studCuts === oldCount+8,'Lumber estimate did not add eight sill studs');
    const expectedMass = (oldArea+8*45*(900-2*45))*95*densities.timber.value/1e9;
    near(computeLoads(model,{people:[]}).details['walls:framing'],expectedMass,'Framing mass');
  });

  await check('Both porch windows show doubled sill studs and reject insufficient clearance',async () => {
    await load(true);
    doc.querySelector('[data-layer-preset="timber"]').click();
    const bounds = node => {
      const points = node.getAttribute('points').trim().split(/\s+/).map(pair => pair.split(',').map(Number));
      return {left:Math.min(...points.map(p => p[0])),right:Math.max(...points.map(p => p[0])),
        top:Math.min(...points.map(p => p[1])),bottom:Math.max(...points.map(p => p[1]))};
    };
    for (const side of ['front','right']) {
      doc.querySelector(`[data-view="${side}"]`).click();
      const slab = bounds(doc.querySelector('.slab-edge'));
      const opening = bounds(doc.querySelector('polygon.opening-guide.window-opening'));
      const scale = (slab.right-slab.left)/Number(field(side === 'front' ? 'width' : 'length').value);
      const width = Number(field('studWidth').value), sill = Number(field(side+'Bottom').value);
      const studs = [...doc.querySelectorAll('polygon.lumber.stud')].map(bounds);
      for (const x of [opening.left,opening.left+width*scale,opening.right-2*width*scale,opening.right-width*scale]) {
        assert(studs.some(stud => Math.abs(stud.left-x) < .01 && Math.abs(stud.right-x-width*scale) < .01 &&
          Math.abs(stud.top-(slab.top-(sill-width)*scale)) < .01 &&
          Math.abs(stud.bottom-(slab.top-width*scale)) < .01),`Missing doubled sill stud in ${side} view`);
      }
    }
    for (const side of ['front','right']) {
      field(side+'Bottom').value = '90';
      field(side+'Bottom').dispatchEvent(new win.Event('input',{bubbles:true}));
      assert(field('status').textContent.includes(`Raise the ${side} window`) &&
        field(side+'Bottom').getAttribute('aria-invalid') === 'true','Insufficient sill clearance was accepted');
      edit(side+'Bottom',91);
    }
    const rightTop = Number(field('rightTop').value);
    field('rightTop').value = String(rightTop+2);
    field('rightTop').dispatchEvent(new win.Event('input',{bubbles:true}));
    assert(field('status').textContent.includes('Raise the right window'),'An insufficient calculated bottom clearance was accepted');
    edit('rightTop',rightTop);
    edit('width',2850);
    const saved = JSON.parse(localStorage.getItem(settingsKey));
    saved.fields.frontBottom = '90';
    saved.anchors.front = 'Bottom';
    localStorage.setItem(settingsKey,JSON.stringify(saved));
    await load();
    assert(field('width').value === '2850' && field('frontBottom').value === '90' &&
      field('status').textContent.includes('Raise the front window') &&
      JSON.parse(localStorage.getItem(settingsKey)).fields.frontBottom === '90',
      'A saved layout with insufficient sill clearance was lost or silently changed');
    edit('frontBottom',91);
    await load();
    assert(field('width').value === '2850' && field('frontBottom').value === '91' && !field('status').textContent,
      'Correcting the saved layout did not preserve the other settings');
  });

  await check('Standing flashing follows the roof and warns on upper-window contact',async () => {
    await load(true);
    const number = id => Number(field(id).value);
    const slope = Math.tan(number('pitch')*Math.PI/180);
    const bottom = number('frontWallHeight')+slope*number('length')+
      number('rafterDepth')*Math.hypot(1,slope)+8+2;
    const top = bottom+number('flashingHeight');
    const warning = () => field('flashing-warning').textContent;
    assert(!warning(),'Default upper window unexpectedly touches the flashing');
    const gap = Math.floor(top+number('slabThickness')+25);
    edit('houseUpperSill',gap+1);
    assert(!warning(),'A gap above the window sill was treated as contact');
    edit('houseUpperSill',gap);
    assert(warning().includes('upper window'),'Contact with the window sill was not reported');
    edit('slabOriginOffset',1000);
    assert(!warning(),'Moving the slab away from the window did not clear the warning');
    edit('slabOriginOffset',3494);
    assert(warning(),'Restoring the slab position did not restore the warning');
    doc.querySelector('[data-view="front"]').click();
    const bounds = selector => {
      const polygon = doc.querySelector(selector);
      assert(polygon,`Missing ${selector}`);
      const points = polygon.getAttribute('points').trim().split(/\s+/).map(pair => pair.split(',').map(Number));
      return {left:Math.min(...points.map(p => p[0])),right:Math.max(...points.map(p => p[0])),
        top:Math.min(...points.map(p => p[1])),bottom:Math.max(...points.map(p => p[1]))};
    };
    const facade = bounds('.house-facade'), slab = bounds('.slab-edge'), flashing = bounds('.roof-standing-flashing');
    const scale = (facade.right-facade.left)/number('houseWallWidth');
    near((flashing.right-flashing.left)/scale,number('roofWidth'),'Flashing width');
    near((slab.left-flashing.left)/scale,number('doorSideOverhang'),'Flashing position');
    near((flashing.bottom-flashing.top)/scale,number('flashingHeight'),'Flashing height');
    near((slab.top-flashing.bottom)/scale,bottom,'Flashing base height');
    edit('houseUpperSill',Math.floor(bottom+number('slabThickness')));
    const contactOffset = number('slabOriginOffset')-number('doorSideOverhang')-95-number('houseUpperWidth')/2;
    edit('houseUpperOffset',contactOffset-1);
    assert(!warning(),'A horizontal gap beside the window was treated as contact');
    edit('houseUpperOffset',contactOffset);
    assert(warning().includes('upper window'),'Flashing touching the window casing was not reported');
    edit('houseUpperSill',Math.floor(bottom+number('slabThickness'))-number('houseUpperHeight')-200);
    assert(!warning(),'A window entirely below the flashing was treated as contact');
    edit('houseUpperSill',Math.floor(bottom+number('slabThickness'))-number('houseUpperHeight')-107-4);
    assert(warning(),'Contact with the sloping apron at the window head was not reported');
    edit('houseUpperSill',Math.floor(bottom+number('slabThickness')));
    for (const view of ['3d','front','left','right','plan']) {
      doc.querySelector(`[data-view="${view}"]`).click();
      assert(doc.querySelector('.roof-abutment-flashing'),`Missing roof apron in ${view}`);
      assert(doc.querySelector(view === '3d' || view === 'front'
        ? '.roof-standing-flashing' : '.roof-standing-flashing-edge'),`Missing standing flashing in ${view}`);
    }
    edit('houseUpperOffset',4894);
    edit('houseUpperSill',gap+20);
    assert(!warning(),'Metal flashing warned despite a vertical gap');
    change(field('roof-material'),'tiles');
    assert(warning(),'Tile profile rise did not update the flashing collision');
    edit('flashingHeight',50);
    assert(!warning(),'Reducing the flashing height did not clear the warning');
    edit('flashingHeight',200);
    assert(warning(),'Increasing the flashing height did not restore the warning');
    doc.querySelector('[data-view="front"]').click();
    const tileSlab = bounds('.slab-edge'), tileFlashing = bounds('.roof-standing-flashing');
    const tileScale = (bounds('.house-facade').right-bounds('.house-facade').left)/number('houseWallWidth');
    near((tileSlab.top-tileFlashing.bottom)/tileScale,bottom-8+number('tileRise'),'Tile flashing base height');
    change(field('roof-display'),'none');
    assert(warning() && !doc.querySelector('.roof-abutment-flashing'),
      'Hiding the roof removed the warning or retained its flashing');
    await load();
    assert(field('flashingHeight').value === '200' && warning(),'Flashing height or warning did not survive reload');
    const saved = JSON.parse(localStorage.getItem(settingsKey));
    delete saved.fields.flashingHeight;
    localStorage.setItem(settingsKey,JSON.stringify(saved));
    await load();
    assert(field('flashingHeight').value === '150' && !field('storage-status').textContent,
      'Existing designs did not restore the default flashing height');
  });

  await check('Plan framing retains the selected stud depth at the wall-thickness limit',async () => {
    await load(true);
    edit('wallThickness',170);
    doc.querySelector('[data-view="plan"]').click();
    const width = selector => {
      const polygon = doc.querySelector(selector);
      assert(polygon,`Missing ${selector}`);
      const xs = polygon.getAttribute('points').trim().split(/\s+/).map(pair => Number(pair.split(',')[0]));
      return Math.max(...xs)-Math.min(...xs);
    };
    for (const depth of [120,145,170]) {
      edit('studDepth',depth);
      const scale = width('polygon[fill="#f8f6e8"]') / Number(field('width').value);
      near(width('.wall-plan[data-layer="studs"]') / scale,depth,'Incorrect drawn stud depth');
    }
  });

  await check('House origin fixes windows and wall while slab position, size and thickness change',async () => {
    await load(true);
    doc.querySelector('[data-view="front"]').click();
    const initial = houseGeometry();
    near(initial.slabFromLeftCentre,3494-650,'Initial slab offset');
    near(initial.wallFromLeftCentre,-505-650,'Initial wall offset');
    near(initial.rightFromLeftCentre,7188+1300,'Initial window gap');
    edit('slabOriginOffset',3694);
    const moved = houseGeometry();
    near(moved.slabFromLeftCentre,initial.slabFromLeftCentre+200,'Slab did not move relative to the window');
    near(moved.wallFromLeftCentre,initial.wallFromLeftCentre,'Moving the slab moved the house wall');
    near(moved.rightFromLeftCentre,initial.rightFromLeftCentre,'Moving the slab moved a house window');
    near(moved.firstCoverFromWall,initial.firstCoverFromWall,'Moving the slab shifted the house cladding');
    edit('width',2850);
    edit('slabThickness',200);
    const resized = houseGeometry();
    near(resized.slabFromLeftCentre,moved.slabFromLeftCentre,'Resizing the slab moved its left edge');
    near(resized.wallFromLeftCentre,initial.wallFromLeftCentre,'Resizing the slab moved the house wall');
    near(resized.leftHeight,initial.leftHeight,'Slab thickness moved a house window above ground');
    near(resized.wallHeight,initial.wallHeight,'Slab thickness changed house height above ground');
    edit('houseWindowGap',6988);
    const spaced = houseGeometry();
    near(spaced.rightFromLeftCentre,initial.rightFromLeftCentre-200,'Window clear gap was not applied');
    near(spaced.upperFromLeftCentre,initial.upperFromLeftCentre,'Window gap moved the upper window');
    edit('houseLeftWidth',1301);
    const wider = houseGeometry();
    near(wider.slabFromLeftCentre,spaced.slabFromLeftCentre-.5,'Left window origin moved when resized');
    near(wider.rightFromLeftCentre,spaced.rightFromLeftCentre+.5,'Window gap did not remain fixed');
    await load();
    assert(field('slabOriginOffset').value === '3694' && field('houseWindowGap').value === '6988' &&
      field('houseLeftWidth').value === '1301','House reference settings did not survive reload');
    near(houseGeometry().slabFromLeftCentre,wider.slabFromLeftCentre,'Saved layout changed on reload');
    field('houseWindowGap').value = '20000';
    field('houseWindowGap').dispatchEvent(new win.Event('input',{bubbles:true}));
    assert(field('status').textContent.includes('extends beyond the sides of the house wall'),
      'An out-of-wall window spacing was accepted');
    near(houseGeometry().slabFromLeftCentre,wider.slabFromLeftCentre,'Invalid spacing changed the drawing');
    edit('houseWindowGap',6988);
    edit('slabOriginOffset',20000);
    doc.querySelector('[data-view="plan"]').click();
    assert(!doc.querySelector('.house-plan'),'An out-of-view house produced a phantom wall in plan');
  });

  await check('Legacy house coordinates migrate to whole millimetres with a rounding notice',async () => {
    await load(true);
    const saved = JSON.parse(localStorage.getItem(settingsKey));
    Object.assign(saved.fields, {
      width:'2801',slabThickness:'141',houseLeftWidth:'1301',houseRightWidth:'1303',
      houseLeftOffset:'-4100',houseRightOffset:'4100',houseUpperOffset:'111',
      houseBasementLeftOffset:'-4001',houseBasementRightOffset:'4003',
      houseLeftSill:'1250',houseRightSill:'1250',houseUpperSill:'3350',houseWallHeight:'4400'
    });
    for (const key of ['slabOriginOffset','houseWindowGap','houseWallLeft']) delete saved.fields[key];
    saved.view = 'front';
    localStorage.setItem(settingsKey,JSON.stringify(saved));
    await load();
    assert(field('storage-status').textContent.includes('left-window origin'),'Migration notice is missing');
    assert(field('slabOriginOffset').value === '3350' && field('houseWallLeft').value === '-648' &&
      field('houseWindowGap').value === '6898' && field('houseUpperOffset').value === '4862' &&
      field('houseBasementLeftOffset').value === '750' && field('houseBasementRightOffset').value === '8754',
      'Legacy horizontal coordinates were not converted');
    assert(field('storage-status').textContent.includes('rounded to whole millimetres'),'Missing rounding notice');
    assert(field('houseWallHeight').value === '4541' && field('houseLeftSill').value === '1391',
      'Legacy heights were not converted to ground level');
    const geometry = houseGeometry();
    near(geometry.slabFromLeftCentre,2699.5,'Migration moved slab');
    near(geometry.wallFromLeftCentre,-1298.5,'Migration did not round the wall position');
    near(geometry.rightFromLeftCentre,8200,'Migration moved the right window');
    near(geometry.upperFromLeftCentre,4211.5,'Migration did not round the upper window position');
    near(geometry.leftHeight,1941,'Migration moved the window above ground');
    near(geometry.wallHeight,4541,'Migration changed the wall height above ground');
    await load();
    assert(!field('storage-status').textContent,'Migration repeated after saving');
    near(houseGeometry().slabFromLeftCentre,geometry.slabFromLeftCentre,'Migrated layout changed on reload');
    for (const prefix of ['houseBasementLeft','houseBasementRight']) {
      for (const suffix of ['Width','Height','Offset','Sill']) delete saved.fields[prefix+suffix];
    }
    localStorage.setItem(settingsKey,JSON.stringify(saved));
    await load();
    assert(field('houseBasementLeftOffset').value === '507' &&
      field('houseBasementRightOffset').value === '8995' &&
      field('houseBasementLeftWidth').value === '900',
      'Older designs without basement windows did not retain the legacy defaults');
  });

  await check('Millimetres use integers throughout the UI without rounding angles or areas',async () => {
    await load(true);
    edit('pitch',14.25);
    const slope = Math.tan(14.25*Math.PI/180);
    const rear = 2350+slope*2200;
    assert(field('rear').textContent === `${Math.round(rear).toLocaleString('en').replaceAll(',','\u202f')} mm`,'Rear height retained decimals');
    assert(field('rise').textContent === `${Math.round(slope*2200).toLocaleString('en').replaceAll(',','\u202f')} mm`,'Roof rise retained decimals');
    assert(field('area').textContent === '6.16 m²','Area lost its precision');
    for (const input of doc.querySelectorAll('#settings input[type="number"]')) {
      if (input.id === 'pitch') continue;
      assert(Number.isInteger(Number(input.value)) && Number(input.step) >= 1,`Fractional field ${input.id}`);
    }
    edit('slabThickness',141);
    doc.querySelector('[data-view="left"]').click();
    assert(field('drawing').textContent.includes('14.25'),'Pitch label lost its decimals');
    for (const view of ['3d','front','left','right','plan']) {
      doc.querySelector(`[data-view="${view}"]`).click();
      assert(!/\d+\.\d+\s*mm\b/.test(field('drawing').textContent),`Fractional drawing label in ${view}`);
    }
    const saved = JSON.parse(localStorage.getItem(settingsKey));
    Object.assign(saved.fields,{doorSideOverhang:'180.5',houseWallLeft:'-505.5',frontBottom:'900.25'});
    localStorage.setItem(settingsKey,JSON.stringify(saved));
    await load();
    assert(field('doorSideOverhang').value === '181' && field('houseWallLeft').value === '-505' &&
      field('frontBottom').value === '900' && field('pitch').value === '14.25','Saved dimensions or pitch rounded incorrectly');
    assert(field('storage-status').textContent.includes('rounded to whole millimetres'),'Rounding was silent');
    const before = field('drawing').innerHTML;
    field('doorSideOverhang').value = '181.5';
    field('doorSideOverhang').dispatchEvent(new win.Event('input',{bubbles:true}));
    assert(field('doorSideOverhang').getAttribute('aria-invalid') === 'true' &&
      field('drawing').innerHTML === before,'A fractional millimetre input changed the drawing');
    edit('doorSideOverhang',181);
    await load();
    assert(!field('storage-status').textContent,'Rounding notice repeated after saving');
    for (const id of ['show-bom','show-loads']) {
      field(id).click();
      const panel = field(id === 'show-bom' ? 'bom-view' : 'loads-view');
      assert(!/\d+\.\d+\s*mm\b/.test(panel.textContent),'Estimate page retained fractional millimetres');
    }
  });

  await check('International number grouping and SI percent spacing are consistent across workspaces',async () => {
    const decimal = createNumberFormat({maximumFractionDigits:2});
    assert(decimal.format(-1234567.89) === '-1\u202f234\u202f567.89' &&
      decimal.format(0.25) === '0.25','Grouping changed signs or decimal precision');
    const percent = createNumberFormat({style:'percent',maximumFractionDigits:1});
    assert(percent.format(.125) === '12.5\u00a0%','Percent spacing or precision is incorrect');
    await load(true);
    assert(field('rear').textContent === '2\u202f899 mm','Millimetres do not use space grouping');
    assert(field('doorWidth').querySelector('[value="1000"]').textContent === '1\u202f000 mm' &&
      field('doorWidth').value === '1000','Formatted options changed their numeric values');
    for (const view of ['3d','front','left','right','plan']) {
      doc.querySelector(`[data-view="${view}"]`).click();
      const text = field('drawing').textContent;
      assert(!/\d,\d{3}/.test(text) && /\d\u202f\d{3} mm/.test(text),`Incorrect grouping in ${view}`);
    }
    field('show-bom').click();
    assert(/\d\u202f\d{3}/.test(field('bom-rows').querySelector('details div').textContent),
      'Cut lengths do not use space grouping');
    const quote = field('bom-rows').querySelector('input');
    change(quote,1234.5);
    assert(/\d\u202f\d{3}\.\d{2} SEK/.test(field('bom-total').textContent),
      'Prices lost space grouping or two decimal places');
    const roofQuote = field('roof-rows').querySelector('input');
    change(roofQuote,10000001);
    assert(field('roof-price-status').textContent.includes('10\u202f000\u202f000 SEK'),
      'Quote validation retained comma grouping');
    change(roofQuote,1234.5);
    assert(!/\d,\d{3}/.test(field('bom-view').textContent),'Estimate text retained comma grouping');
    assert(field('roof-rows').textContent.includes('10\u00a0%'),'Roof allowance lacks SI percent spacing');
    field('show-loads').click();
    assert(/\d\u202f\d{3}/.test(field('loads-total').textContent),'Load totals retained comma grouping');
    assert(field('loads-rows').textContent.includes('100\u00a0%'),'Load shares lack SI percent spacing');
    assert(field('loads-assumptions').textContent.includes('2\u202f500 kg/m³'),
      'Density assumptions do not use space grouping');
  });

  await check('Shared opening trims update every view, estimates, export and restored settings',async () => {
    await load(true);
    const section = field('trims').closest('details');
    assert(section.querySelector('summary').textContent === 'Trims' &&
      section.closest('.parameter-group').querySelector('summary').textContent === 'Openings',
      'Shared trim controls are not under Openings > Trims');
    const casings = () => [...doc.querySelectorAll(
      'polygon[data-trim="door"], polygon[data-window="front"][data-window-part="casing"], polygon[data-window="right"][data-window-part="casing"]'
    )];
    const trimRows = () => [...field('bom-rows').rows].filter(row => row.cells[0].textContent === 'Opening trim');
    edit('trimWidth',145);
    edit('trim-colour','#bf4937');
    for (const view of ['3d','left','front','right','plan']) {
      doc.querySelector(`[data-view="${view}"]`).click();
      if (view === 'plan') {
        const lines = [...field('drawing').querySelectorAll('line.opening-trim')];
        assert(lines.length === 6 && lines.every(line => line.getAttribute('stroke') === '#bf4937'),
          'Plan did not share the trim colour across all openings');
      } else {
        const boards = casings();
        assert(boards.length > 0 && boards.every(board => board.getAttribute('fill') === '#bf4937'),
          `${view} did not share the trim colour across its openings`);
      }
    }
    field('show-bom').click();
    const rows = trimRows();
    assert(rows.length > 0 && rows.every(row => row.cells[1].textContent === '145 \u00d7 22') &&
      rows.reduce((sum,row) => sum+Number.parseInt(row.querySelector('summary').textContent,10),0) === 9,
      'The lumber estimate did not use the shared width for all nine trim boards');
    field('show-loads').click();
    const openingMass = () => Number([...field('loads-breakdown').rows]
      .find(row => row.cells[0].textContent === 'Windows, door & opening trim')
      .cells[1].textContent.replace(/[^\d.-]/g,''));
    const massWithTrim = openingMass();
    field('show-designer').click();
    edit('trimWidth',0);
    doc.querySelector('[data-view="3d"]').click();
    assert(casings().length === 0,'Zero width left a door or window casing visible');
    field('show-bom').click();
    assert(trimRows().length === 0,'Zero width left trim in the lumber estimate');
    field('show-loads').click();
    assert(openingMass() < massWithTrim,'The mass estimate ignored the shared trim width');
    field('show-designer').click();
    edit('trimWidth',145);
    let exported;
    win.URL.createObjectURL = blob => { exported = blob; return 'blob:trim-test'; };
    win.HTMLAnchorElement.prototype.click = () => {};
    field('export-settings').click();
    const saved = JSON.parse(await exported.text());
    assert(saved.fields.trimWidth === '145' && saved.trimColour === '#bf4937' &&
      !('doorTrimWidth' in saved.fields) && !('trimColours' in saved),'Export lost the shared trim settings');
    await load();
    assert(field('trimWidth').value === '145' && field('trim-colour').value === '#bf4937',
      'Shared trim settings did not survive reload');
    field('settings').reset();
    await load();
    assert(field('trimWidth').value === '95' && field('trim-colour').value === '#f5efe1',
      'Reset did not persist the shared trim defaults');
  });

  await check('Legacy trims migrate from the door with an explicit notice only when styles differ',async () => {
    await load(true);
    for (const width of [145,0]) {
      const saved = JSON.parse(localStorage.getItem(settingsKey));
      delete saved.fields.trimWidth;
      delete saved.trimColour;
      saved.fields.footingDepth = '650';
      for (const key of ['door','front','right']) saved.fields[key+'TrimWidth'] = String(width);
      saved.trimColours = {door:'#bf4937',front:'#bf4937',right:'#bf4937'};
      if (width > 0) {
        saved.fields.frontTrimWidth = '70';
        saved.trimColours.right = '#abcdef';
      }
      localStorage.setItem(settingsKey,JSON.stringify(saved));
      await load();
      assert(field('trimWidth').value === String(width) && field('trim-colour').value === '#bf4937' &&
        field('footingDepth').value === '650','Legacy trims or unrelated saved settings were lost');
      assert(field('storage-status').textContent.includes('unified') === (width > 0),
        'Legacy trim migration notice was missing or unnecessary');
      await load();
      assert(!field('storage-status').textContent,'Migrated trims produced a repeated warning');
    }
    const invalid = JSON.parse(localStorage.getItem(settingsKey));
    invalid.trimColours = {door:'#abcdef'};
    for (const colour of ['not-a-colour',null]) {
      invalid.trimColour = colour;
      localStorage.setItem(settingsKey,JSON.stringify(invalid));
      await load();
      assert(field('storage-status').textContent.includes('invalid') && field('trimWidth').value === '95',
        'An invalid saved shared colour was accepted or replaced by a legacy value');
    }
  });

  await check('New footing defaults render correctly; saved settings survive until Reset',async () => {
    function verify(columns, rows, diameter, depth) {
      assert(field('footing-layout').value === `${columns}x${rows}` &&
        Number(field('footingDiameter').value) === diameter && Number(field('footingDepth').value) === depth,
        'Footing settings did not match the expected new, saved or reset design');
      assert(!field('status').textContent,field('status').textContent);
      field('show-loads').click();
      const piers = [...field('loads-diagram').querySelectorAll('.loads-pier circle')];
      assert(piers.length === columns*rows &&
        new Set(piers.map(pier => pier.getAttribute('cx'))).size === columns &&
        new Set(piers.map(pier => pier.getAttribute('cy'))).size === rows &&
        piers.every(pier => Number(pier.getAttribute('r')) === diameter/2),
        'Rendered footings did not use the selected grid and diameter');
      field('show-designer').click();
    }
    await load(true);
    verify(3,2,251,400);
    change(field('footing-layout'),'2x3');
    edit('footingDiameter',403);
    edit('footingDepth',900);
    await load();
    verify(2,3,403,900);
    field('settings').reset();
    verify(3,2,251,400);
    await load();
    verify(3,2,251,400);
  });

  await check('Calculated clearances round-trip; anchored limits and invalid-setting notices remain enforced',async () => {
    await load(true);
    edit('length',6000);
    edit('pitch',60);
    edit('frontWallHeight',3500);
    for (const anchor of ['Bottom','Top']) {
      if (anchor === 'Top') edit('rightTop',1000);
      const derived = `right${anchor === 'Bottom' ? 'Top' : 'Bottom'}`;
      assert(Number(field(derived).value) > Number(field(derived).max),'Large calculated clearance was not exercised');
      await load();
      assert(field('length').value === '6000' && Number(field(derived).value) > 5000,
        'A valid saved design was replaced by defaults');
      assert(!field('storage-status').textContent,'Valid saved clearances produced a warning');
    }
    const saved = JSON.parse(localStorage.getItem(settingsKey));
    saved.fields.rightBottom = 'stale derived value';
    localStorage.setItem(settingsKey,JSON.stringify(saved));
    await load();
    assert(field('length').value === '6000' && Number(field('rightBottom').value) > 5000,
      'Calculated values were trusted instead of recomputed');
    saved.fields.rightTop = '5001';
    saved.fields.tileWidth = '290';
    localStorage.setItem(settingsKey,JSON.stringify(saved));
    await load();
    const notice = field('storage-status').textContent;
    assert(notice.includes('invalid') && !notice.includes('adjusted'),
      'Invalid anchored values were accepted or reported as a successful migration');
  });

  await check('Stored lumber and roof quotes use the same bounds as entered prices',async () => {
    await load(true);
    const sku = deromeCatalogue[0].stock[0].sku;
    localStorage.setItem(lumberKey,JSON.stringify([[sku,{amount:10000001,unit:'piece'}]]));
    localStorage.setItem(roofKey,JSON.stringify([['roof-deck',10000001]]));
    await load();
    assert(field('bom-price-status').textContent.includes('could not be loaded'),'Oversized saved lumber quote was accepted');
    assert(field('roof-price-status').textContent.includes('could not be loaded'),'Oversized saved roof quote was accepted');
    localStorage.setItem(lumberKey,JSON.stringify([[sku,{amount:10000000,unit:'metre'}]]));
    localStorage.setItem(roofKey,JSON.stringify([['roof-deck',10000000]]));
    await load();
    assert(!field('bom-price-status').textContent && !field('roof-price-status').textContent,
      'A quote at the permitted upper limit was rejected');
  });

  await check('Duplicate article quotes synchronize values, units and validation state',async () => {
    await load(true);
    field('show-bom').click();
    const groups = new Map();
    for (const row of field('bom-rows').rows) {
      const sku = row.querySelector('a')?.textContent;
      if (!sku) continue;
      if (!groups.has(sku)) groups.set(sku,[]);
      groups.get(sku).push(row);
    }
    const duplicates = [...groups.values()].find(rows => rows.length > 1);
    assert(duplicates,'No repeated stock article was exercised');
    change(duplicates[0].querySelector('input'),-1);
    change(duplicates[1].querySelector('input'),25);
    for (const row of duplicates) {
      const input = row.querySelector('input');
      assert(input.value === '25' && !input.hasAttribute('aria-invalid'),'Synchronized quote retained a stale validation error');
    }
    change(duplicates[1].querySelector('select'),'metre');
    assert(duplicates.every(row => row.querySelector('select').value === 'metre'),'Quote units did not synchronize');
    assert(!field('bom-price-status').textContent,'Resolved quote still reports an error');
  });

  await check('Unrelated invalid quote drafts and notices survive other edits, then clear when rows rebuild',async () => {
    await load(true);
    field('show-bom').click();
    const rows = [...field('bom-rows').rows].filter(row => row.querySelector('input'));
    const first = rows[0], sku = first.querySelector('a').textContent;
    const other = rows.find(row => row.querySelector('a').textContent !== sku);
    const bad = first.querySelector('input');
    change(bad,-1);
    change(other.querySelector('input'),30);
    assert(bad.value === '-1' && bad.getAttribute('aria-invalid') === 'true' &&
      field('bom-price-status').textContent.includes('Enter a quote'),'Unrelated lumber edit hid an invalid draft or its notice');
    const roof = field('roof-rows').querySelectorAll('input');
    change(roof[0],-1);
    change(roof[1],40);
    assert(roof[0].value === '-1' && field('roof-price-status').textContent.includes('Enter a quote'),
      'Unrelated roof edit hid an invalid draft or its notice');
    field('show-designer').click();
    edit('width',2810);
    field('show-bom').click();
    assert(!field('bom-price-status').textContent && !field('roof-price-status').textContent,
      'Discarded draft validation errors survived a row rebuild');
  });

  await check('Quote storage failures remain visible without discarding applied prices',async () => {
    await load(true);
    field('show-bom').click();
    win.Storage.prototype.setItem = () => { throw new win.DOMException('Test quota exceeded','QuotaExceededError'); };
    const rows = field('roof-rows').querySelectorAll('input');
    change(rows[0],50);
    change(rows[1],-1);
    const notice = field('roof-price-status').textContent;
    assert(notice.includes('could not be saved') && notice.includes('Enter a quote'),
      'Validation hid the quote persistence failure');
    assert(rows[0].value === '50' && !field('roof-total').textContent.includes('not yet priced'),
      'A storage failure discarded the applied price');
  });

  await check('Dragging coalesces redraws, flushes the last move and stops on capture loss or cancellation',async () => {
    await load(true);
    field('show-loads').click();
    const svg = field('loads-diagram'), frames = new Map();
    let next = 0, draws = 0, captured = false;
    win.requestAnimationFrame = callback => { frames.set(++next,callback); return next; };
    win.cancelAnimationFrame = id => frames.delete(id);
    svg.setPointerCapture = () => { captured = true; };
    svg.hasPointerCapture = () => captured;
    svg.releasePointerCapture = () => { captured = false; };
    const replace = svg.replaceChildren.bind(svg);
    svg.replaceChildren = (...nodes) => { draws++; replace(...nodes); };
    const person = () => svg.querySelector('[data-person="0"]');
    const position = () => {
      const circle = person().querySelector('circle');
      return {x:Number(circle.getAttribute('cx')),y:Number(circle.getAttribute('cy'))+60};
    };
    const pointer = (target,type,point) => {
      const screen = new win.DOMPoint(point.x,point.y).matrixTransform(svg.getScreenCTM());
      target.dispatchEvent(new win.PointerEvent(type,{
        bubbles:true,cancelable:true,pointerId:1,button:0,clientX:screen.x,clientY:screen.y
      }));
    };
    const tick = () => {
      const callbacks = [...frames.values()];
      frames.clear();
      callbacks.forEach(callback => callback(win.performance.now()));
    };
    const start = position();
    pointer(person(),'pointerdown',start);
    for (let i=1;i<=5;i++) pointer(svg,'pointermove',{x:start.x+20*i,y:start.y});
    assert(draws === 0 && frames.size === 1,'Pointer moves rebuilt the diagram before the next animation frame');
    tick();
    assert(draws === 1 && Math.abs(position().x-start.x-100) < 1e-3,
      `A frame did not render the latest drag position (${draws} redraws, ${position().x-start.x} mm movement)`);
    pointer(svg,'pointermove',{x:start.x+150,y:start.y});
    pointer(svg,'pointerup',{x:start.x+150,y:start.y});
    assert(draws === 2 && frames.size === 0 && !captured &&
      Math.abs(position().x-start.x-150) < 1e-3,'Pointer release lost the final move or left pending work');
    for (const event of ['lostpointercapture','pointercancel']) {
      const before = position();
      pointer(person(),'pointerdown',before);
      pointer(svg,'pointermove',{x:before.x+25,y:before.y});
      pointer(svg,event,{x:before.x+25,y:before.y});
      pointer(svg,'pointermove',{x:start.x+300,y:start.y});
      assert(frames.size === 0 && !captured && Math.abs(position().x-before.x-25) < 1e-3,
        `${event} did not flush pending movement and end dragging`);
    }
    person().focus();
    const before = position();
    person().dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
    assert(Math.abs(position().x-before.x-100) < 1e-6 && doc.activeElement === person(),
      'Keyboard movement lost the new position or focus');
  });

  results.textContent = failed.length
    ? `FAIL (${failed.length})\n${failed.join('\n')}\nPASS (${passed.length})\n${passed.join('\n')}`
    : `PASS (${passed.length})\n${passed.join('\n')}`;
} finally {
  frame.remove();
  for (const [key,value] of originals) {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key,value);
  }
}
</script>
