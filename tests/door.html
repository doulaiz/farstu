<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Door rendering regression tests</title>
<pre id="results">Running...</pre>
<script type="module">
const results = document.querySelector('#results');
const key = 'farstu-designer-settings-v1';
const original = localStorage.getItem(key);
const frame = document.createElement('iframe');
const passed = [];
function assert(condition, message) {
  if (!condition) throw new Error(message);
}
function vertices(polygon) {
  return polygon.getAttribute('points').trim().split(/\s+/).map(pair => pair.split(',').map(Number));
}
function contains(points, x, y) {
  let inside = false;
  for (let i=0,j=points.length-1;i<points.length;j=i++) {
    const [a,b] = points[i], [c,d] = points[j];
    if ((b>y) !== (d>y) && x < (c-a)*(y-b)/(d-b)+a) inside = !inside;
  }
  return inside;
}
function overlaps(a, b) {
  const left = Math.max(Math.min(...a.map(p=>p[0])),Math.min(...b.map(p=>p[0])));
  const right = Math.min(Math.max(...a.map(p=>p[0])),Math.max(...b.map(p=>p[0])));
  const top = Math.max(Math.min(...a.map(p=>p[1])),Math.min(...b.map(p=>p[1])));
  const bottom = Math.min(Math.max(...a.map(p=>p[1])),Math.max(...b.map(p=>p[1])));
  if (right-left < 1e-6 || bottom-top < 1e-6) return false;
  for (let i=1;i<16;i++) for (let j=1;j<16;j++) {
    const x = left+(right-left)*i/16, y = top+(bottom-top)*j/16;
    if (contains(a,x,y) && contains(b,x,y)) return true;
  }
  return false;
}
async function load() {
  const ready = new Promise(resolve => frame.onload = resolve);
  frame.src = '../?door-regression';
  document.body.append(frame);
  await ready;
}
try {
  localStorage.removeItem(key);
  await load();
  let doc = frame.contentDocument, win = frame.contentWindow;
  const reload = async () => {
    await load();
    doc = frame.contentDocument;
    win = frame.contentWindow;
  };
  const field = id => doc.getElementById(id);
  const edit = (id,value,event='input') => {
    field(id).value = String(value);
    field(id).dispatchEvent(new win.Event(event,{bubbles:true}));
    assert(!field('status').textContent,field('status').textContent);
  };
  const frames = new Map();
  let nextFrame = 0;
  win.requestAnimationFrame = callback => {
    frames.set(++nextFrame,callback);
    return nextFrame;
  };
  win.cancelAnimationFrame = id => frames.delete(id);
  win.matchMedia = () => ({matches:false});
  const tick = time => {
    const callbacks = [...frames.values()];
    frames.clear();
    callbacks.forEach(callback => callback(time));
  };
  const parts = () => [...doc.querySelectorAll('.door-leaf polygon')]
    .filter(p => p.closest('[data-door-face]') && !p.closest('[display="none"]'));
  function checkDrawing() {
    assert(parts().some(p => {
      const points = vertices(p);
      return Math.abs(points.reduce((sum,[x,y],i) => {
        const [u,v] = points[(i+1)%points.length];
        return sum+x*v-u*y;
      },0)) > 1e-4;
    }),'Door disappeared');
    assert(!/NaN|Infinity/.test(field('drawing').innerHTML),'Invalid door coordinates');
  }
  function checkOcclusion(open) {
    let intersections = 0;
    for (const part of parts()) {
      for (const trim of doc.querySelectorAll('polygon[data-trim="door"]')) {
        if (!overlaps(vertices(part),vertices(trim))) continue;
        intersections++;
        const trimAfterDoor = Boolean(part.compareDocumentPosition(trim) & win.Node.DOCUMENT_POSITION_FOLLOWING);
        assert(trimAfterDoor !== open,open
          ? 'Trim covers the outward-open leaf'
          : 'Recessed door thickness paints over the trim');
      }
    }
    assert(intersections > 0,'No projected trim/door overlap was exercised');
  }
  const styles = ['none','vertical','rectangular','half-circle'];
  assert(field('door-window').value === 'rectangular','Default door glazing changed');
  assert(field('door-window').closest('.parameter-section').querySelector('#door'),
    'Glazing selector is outside the door configuration');
  const box = polygon => {
    const points = vertices(polygon), xs = points.map(p=>p[0]), ys = points.map(p=>p[1]);
    return {left:Math.min(...xs),right:Math.max(...xs),top:Math.min(...ys),bottom:Math.max(...ys)};
  };
  for (const style of styles) for (const handing of ['ltr','rtl']) {
    edit('door-window',style,'change');
    edit('door-handing',handing,'change');
    for (const [width,height] of [[800,2000],[1100,2200]]) {
      edit('doorWidth',width);
      edit('doorHeight',height);
      doc.querySelector('[data-view="left"]').click();
      const glass = doc.querySelector('polygon[data-door-part="glass"]');
      const rim = doc.querySelector('polygon[data-door-part="glazing-frame"]');
      if (style === 'none') {
        assert(!glass && !rim && !doc.querySelector('[data-door-part="muntin"]'),
          'Solid door still has glazing');
        continue;
      }
      assert(glass && rim,'Glazing or its frame is missing');
      const points = vertices(glass), bounds = box(glass);
      const body = doc.querySelector('polygon[data-door-face="outer"]:not([data-door-part])');
      assert(points.every(([x,y]) => contains(vertices(body),x,y) && contains(vertices(rim),x,y)),
        'Glass escaped the leaf or glazing frame');
      assert(!overlaps(points,vertices(doc.querySelector('[data-door-part="handle"]'))),
        'Glazing collides with the handle');
      const paneWidth = bounds.right-bounds.left, paneHeight = bounds.bottom-bounds.top;
      if (style === 'vertical') {
        const leaf = box(body), centre = (bounds.left+bounds.right)/2, middle = (leaf.left+leaf.right)/2;
        assert(paneHeight/paneWidth > 3,'Narrow light is not tall and skinny');
        assert(handing === 'ltr' ? centre > middle : centre < middle,
          'Narrow light did not mirror towards the handle side');
      } else if (style === 'half-circle') {
        const centre = (bounds.left+bounds.right)/2, radius = paneWidth/2;
        assert(Math.abs(paneHeight-radius) < 1e-6,'Fanlight is not a true half-circle');
        assert(points.every(([x,y]) => Math.abs(Math.hypot(x-centre,y-bounds.bottom)-radius) < 1e-6),
          'Fanlight arc is distorted');
        assert(doc.querySelectorAll('[data-door-part="muntin"]').length === 3,'Fanlight muntins missing');
      } else {
        assert(points.length === 4 && paneWidth > paneHeight/2,'Upper rectangular light is distorted');
      }
    }
  }
  edit('doorWidth',1000);
  edit('doorHeight',2100);
  passed.push('Four glazing styles, frame containment, handle clearance and mirrored proportions at door module limits');

  for (const style of styles) for (const handing of ['ltr','rtl']) for (const thickness of [40,100]) {
    edit('door-window',style,'change');
    edit('door-handing',handing,'change');
    edit('doorThickness',thickness);
    for (const view of ['3d','left','plan']) {
      doc.querySelector(`[data-view="${view}"]`).click();
      checkDrawing();
      if (view === '3d') checkOcclusion(false);
      const start = win.performance.now();
      field('toggle-door').click();
      tick(start+275);
      checkDrawing();
      tick(start+1000);
      checkDrawing();
      if (view === '3d') checkOcclusion(true);
      if (view === '3d' && style !== 'none') {
        const face = handing === 'ltr' ? 'inner' : 'outer';
        assert(doc.querySelector(`polygon[data-door-face="${face}"][data-door-part="glass"]`),
          'Glazing is missing from the visible face of the open door');
      }
      const close = win.performance.now();
      field('toggle-door').click();
      tick(close+275);
      checkDrawing();
      tick(close+1000);
      checkDrawing();
      if (view === '3d') checkOcclusion(false);
    }
    passed.push(`${style}, ${handing}, ${thickness} mm: trim occlusion and full animation in 3D, Left and Plan`);
  }
  doc.querySelector('[data-view="3d"]').click();
  for (const width of [70,195]) {
    edit('trimWidth',width);
    checkOcclusion(false);
  }
  const colour = field('trim-colour');
  colour.value = '#bf4937';
  colour.dispatchEvent(new win.Event('input',{bubbles:true}));
  assert([...doc.querySelectorAll('polygon[data-trim="door"]')]
    .every(p => p.getAttribute('fill') === '#bf4937'),'Door trim colour was lost');
  win.matchMedia = () => ({matches:true});
  field('toggle-door').click();
  assert(frames.size === 0,'Reduced-motion swing scheduled animation frames');
  checkDrawing();
  checkOcclusion(true);
  field('toggle-door').click();
  checkOcclusion(false);
  edit('trimWidth',0);
  assert(doc.querySelectorAll('[data-trim="door"]').length === 0,'Zero-width door trim remains visible');
  edit('trimWidth',95);
  doc.querySelector('[data-wall-layer="trim"]').checked = false;
  doc.querySelector('#wall-layers').dispatchEvent(new win.Event('change',{bubbles:true}));
  assert(doc.querySelectorAll('[data-trim="door"]').length === 0,'Hidden door trim remains visible');
  passed.push('Trim sizes, colour, reduced motion, zero-width and hidden trim');
  for (const style of styles) {
    edit('door-window',style,'change');
    assert(JSON.parse(localStorage.getItem(key)).doorWindow === style,'Door glazing was not saved');
    await reload();
    assert(field('door-window').value === style,'Saved door glazing did not restore');
    assert(doc.querySelector('.door-leaf').dataset.doorWindow === style,'Restored glazing was not drawn');
  }
  let exported;
  win.URL.createObjectURL = blob => { exported = blob; return 'blob:door-test'; };
  win.HTMLAnchorElement.prototype.click = () => {};
  field('export-settings').click();
  assert(exported && JSON.parse(await exported.text()).doorWindow === 'half-circle','Export lost door glazing');
  const saved = JSON.parse(localStorage.getItem(key));
  delete saved.doorWindow;
  localStorage.setItem(key,JSON.stringify(saved));
  await reload();
  assert(field('door-window').value === 'rectangular' && !field('storage-status').textContent,
    'Old settings did not retain rectangular glazing');
  localStorage.setItem(key,JSON.stringify({...saved,doorWindow:'diamond'}));
  await reload();
  assert(field('storage-status').textContent.includes('invalid') && field('door-window').value === 'rectangular',
    'Unknown saved glazing was not rejected with a notice');
  edit('door-window','none','change');
  doc.querySelector('button[type="reset"]').click();
  assert(field('door-window').value === 'rectangular' &&
    JSON.parse(localStorage.getItem(key)).doorWindow === 'rectangular','Reset did not restore default glazing');
  passed.push('All glazing choices persist; export, legacy settings, invalid settings and Reset are handled');
  results.textContent = `PASS (${passed.length})\n${passed.join('\n')}`;
} catch (error) {
  results.textContent = `FAIL after ${passed.length} groups: ${error.message}\n${error.stack}`;
  console.error(error);
} finally {
  frame.remove();
  if (original === null) localStorage.removeItem(key);
  else localStorage.setItem(key,original);
}
</script>
</html>
